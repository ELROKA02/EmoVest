version: "2"
type: frontend
tech_stack:
  - JavaScript (ES2024)
  - React 19
  - Vite 8
  - React Router v7
  - Tailwind CSS 4 (with PostCSS)
  - Axios 1.x and native fetch
  - FullCalendar (daygrid/timegrid/interaction)
  - Recharts (charting)
  - SessionStorage for JWT tokens, LocalStorage for "remember email" and userName
routes:
  - path: /
    file: src/components/Hero.jsx
    auth_required: false
    description: Landing page with marketing hero and Footer
  - path: /login
    file: src/components/Login.jsx
    auth_required: false
    description: User login (email + password) with "Remember me" and link to /forgot-password
  - path: /signup
    file: src/components/Signup.jsx
    auth_required: false
    description: User registration form (name, email, password, account type free/premium, terms checkbox)
  - path: /forgot-password
    file: src/components/ForgotPassword.jsx
    auth_required: false
    description: Request password-reset email
  - path: /reset-password
    file: src/components/ResetPassword.jsx
    auth_required: false
    description: Submit new password using token from reset email
  - path: /dashboard
    file: src/components/Dashboard.jsx
    auth_required: true
    description: Main dashboard with trading-account selector, monthly stats and account creation
  - path: /dashboard/operaciones
    file: src/components/Dashboard.jsx
    auth_required: true
    description: Same Dashboard component rendered under the operaciones sub-route
  - path: /trading
    file: src/components/OperacionesTrading.jsx
    auth_required: true
    description: CRUD of trading operations within a selected account
  - path: /perfil
    file: src/components/PerfilUsuario.jsx
    auth_required: true
    description: User profile, list/manage trading accounts (create, edit, delete, adjust funds)
  - path: /estadisticas
    file: src/components/EstadisticasEmocionales.jsx
    auth_required: true
    description: Emotional-context statistics by year/month for a selected account
  - path: /calendar
    file: src/components/calendar.jsx
    auth_required: true
    description: Calendar view of daily PnL using FullCalendar
features:
  - name: User Login
    description: Authenticate with email and password, store JWT in sessionStorage, fetch /me to cache userName
    files:
      - src/components/Login.jsx
      - src/utils/userSession.js
    entry_route: /login
    user_interactions:
      - Fill email input
      - Fill password input
      - Optionally toggle "Recordarme" to persist email in localStorage
      - Click "Iniciar sesión" button
      - On success navigate to /dashboard
      - On failure see error message under the form
    api_calls:
      - method: POST
        endpoint: /login
      - method: GET
        endpoint: /me
    auth_required: false
  - name: User Registration
    description: Create a new account with name, email, password and plan selection (free/premium); requires accepting T&C
    files:
      - src/components/Signup.jsx
    entry_route: /signup
    user_interactions:
      - Fill name, email, password, confirm password
      - Select plan (Gratis or Premium)
      - Check terms and conditions checkbox
      - Click "Registrarme" submit button
      - On success redirect to /login
      - On validation error see inline error message
    api_calls:
      - method: POST
        endpoint: /signup
    auth_required: false
  - name: Forgot Password
    description: Request password-reset email
    files:
      - src/components/ForgotPassword.jsx
    entry_route: /forgot-password
    user_interactions:
      - Enter email
      - Click "Enviar enlace"
      - See success message or error
    api_calls:
      - method: POST
        endpoint: /forgot-password
    auth_required: false
  - name: Reset Password
    description: Use email token to set a new password
    files:
      - src/components/ResetPassword.jsx
    entry_route: /reset-password
    user_interactions:
      - Token is read from URL query string
      - Enter new password and confirm
      - Click "Restablecer contraseña"
      - On success redirect to /login
    api_calls:
      - method: POST
        endpoint: /reset-password
    auth_required: false
  - name: Trading Accounts CRUD
    description: View, create, update, delete trading accounts and adjust account funds
    files:
      - src/components/PerfilUsuario.jsx
      - src/components/Dashboard.jsx
    entry_route: /perfil
    user_interactions:
      - View list of accounts
      - Click "Nueva cuenta" and fill form (name, broker, funds, currency)
      - Edit an account
      - Delete an account (with confirmation)
      - Adjust funds via a modal (deposit / withdraw)
    api_calls:
      - method: GET
        endpoint: /cuentas/vercuentas
      - method: POST
        endpoint: /cuentas/crearcuenta
      - method: PUT
        endpoint: /cuentas/actualizarcuenta/{id}
      - method: DELETE
        endpoint: /cuentas/eliminarcuenta/{id}
    auth_required: true
  - name: Trading Operations CRUD
    description: Manage operations (buy/sell entries) under a selected trading account
    files:
      - src/components/OperacionesTrading.jsx
    entry_route: /trading
    user_interactions:
      - Select an account from the dropdown
      - View list of operations
      - Add a new operation via form (instrument, type, lots, prices, emotion, etc.)
      - Edit an existing operation
      - Delete an operation with confirmation
    api_calls:
      - method: GET
        endpoint: /cuentas/{cuentaId}/operaciones/
      - method: POST
        endpoint: /cuentas/{cuentaId}/operaciones/
      - method: PUT
        endpoint: /cuentas/{cuentaId}/operaciones/{operacionId}
      - method: DELETE
        endpoint: /cuentas/{cuentaId}/operaciones/{operacionId}
    auth_required: true
  - name: Dashboard Statistics
    description: Show monthly aggregated stats (PnL, win rate, etc.) for a selected account and month/year
    files:
      - src/components/Dashboard.jsx
    entry_route: /dashboard
    user_interactions:
      - Select an account
      - Select month and year via custom selects
      - View charts and KPIs that refresh on selection change
    api_calls:
      - method: GET
        endpoint: /cuentas/{cuentaId}/estadisticas/{year}/{month}
      - method: GET
        endpoint: /cuentas/vercuentas
    auth_required: true
  - name: Emotional Statistics
    description: View statistics broken down by emotional context for a given month/year
    files:
      - src/components/EstadisticasEmocionales.jsx
    entry_route: /estadisticas
    user_interactions:
      - Select account, year and month
      - View bar/pie/line charts (Recharts) of emotions vs PnL
    api_calls:
      - method: GET
        endpoint: /cuentas/{cuentaId}/estadisticas/emociones?year={year}&month={month}
      - method: GET
        endpoint: /cuentas/vercuentas
    auth_required: true
  - name: Calendar View
    description: Calendar grid of daily PnL for a selected account using FullCalendar
    files:
      - src/components/calendar.jsx
    entry_route: /calendar
    user_interactions:
      - Select an account
      - Navigate month/year in the calendar header
      - Hover/click days to see PnL detail
    api_calls:
      - method: GET
        endpoint: /cuentas/{cuentaId}/estadisticas/calendario?year={year}&month={month}
      - method: GET
        endpoint: /cuentas/vercuentas
    auth_required: true
  - name: Navigation and Header
    description: Top header with brand, navigation links and authentication-aware links
    files:
      - src/components/Header.jsx
      - src/components/Navbar.jsx
      - src/components/Sidebar.jsx
    entry_route: /
    user_interactions:
      - Click brand logo to go to /
      - Click navigation links (Login, Signup, Dashboard, Trading, Perfil, Estadisticas, Calendar)
      - Logout from user menu when authenticated
    api_calls: []
    auth_required: false
known_limitations:
  - issue: Token is stored in sessionStorage and cleared on tab close; "Recordarme" only persists email, not session
    location: src/components/Login.jsx, src/utils/userSession.js
    impact: Users must re-authenticate after closing the tab even with "Recordarme" enabled
  - issue: API base URL is hardcoded to http://localhost:8000 in multiple components
    location: src/components/Login.jsx, Signup.jsx, ForgotPassword.jsx, ResetPassword.jsx, Dashboard.jsx, OperacionesTrading.jsx, PerfilUsuario.jsx, EstadisticasEmocionales.jsx, calendar.jsx, src/utils/userSession.js
    impact: Frontend cannot easily target a different backend without code changes (no env-variable config)
  - issue: No client-side route guard — authenticated routes are reachable without a token; protection relies on backend 401 only
    location: src/App.jsx
    impact: Authenticated pages mount and call APIs before redirecting, which can produce flashes of empty UI and unnecessary failed requests
  - issue: Mixed use of fetch and axios across components
    location: frontend/src/components/*
    impact: Inconsistent error handling and headers; harder to add interceptors (e.g., automatic JWT refresh)
