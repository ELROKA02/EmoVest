name: EmoVest Desktop Windows

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publicar una release firmada"
        required: true
        type: boolean
        default: false
      version:
        description: "Versión semántica sin prefijo v (obligatoria al publicar)"
        required: false
        type: string
      confirm_release:
        description: "Escribe PUBLICAR para autorizar una publicación"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_MODE: desktop
  PYTHONUTF8: "1"

jobs:
  build:
    name: Tests, sidecar e instalador
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      EMOVEST_DESKTOP_TOKEN: ci-only-token-000000000000000000000000000000000000000000000000

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6

      - name: Configurar rutas temporales de EmoVest
        shell: pwsh
        run: |
          "EMOVEST_DATA_DIR=$env:RUNNER_TEMP\EmoVest CI\data" >> $env:GITHUB_ENV
          "EMOVEST_CONFIG_DIR=$env:RUNNER_TEMP\EmoVest CI\config" >> $env:GITHUB_ENV
          "EMOVEST_LOG_DIR=$env:RUNNER_TEMP\EmoVest CI\logs" >> $env:GITHUB_ENV
          "EMOVEST_BACKUP_DIR=$env:RUNNER_TEMP\EmoVest CI\backups" >> $env:GITHUB_ENV
          "IMAGE_STORAGE_DIR=$env:RUNNER_TEMP\EmoVest CI\data\images" >> $env:GITHUB_ENV
          "EMOVEST_MODEL_DIR=$env:RUNNER_TEMP\EmoVest CI\data\models" >> $env:GITHUB_ENV

      - name: Preparar pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.3
          run_install: false

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Preparar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Instalar dependencias
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements.txt
          pnpm --dir frontend install --frozen-lockfile

      - name: Validar backend de escritorio
        working-directory: backend
        run: python -m unittest discover -s tests -v

      - name: Validar frontend
        working-directory: frontend
        shell: pwsh
        run: |
          pnpm lint
          pnpm build

      - name: Validar Rust de escritorio
        working-directory: frontend/src-tauri
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          cargo check --locked
          cargo test --locked

      - name: Construir sidecar Windows
        shell: pwsh
        run: .\scripts\build-windows-sidecar.ps1

      - name: Validar sidecar Windows empaquetado
        shell: pwsh
        run: .\scripts\test-windows-sidecar.ps1

      - name: Validar requisitos de publicación
        if: ${{ inputs.publish_release == true }}
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          CONFIRM_RELEASE: ${{ inputs.confirm_release }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          if ($env:CONFIRM_RELEASE -ne "PUBLICAR") {
            throw "La publicación requiere confirm_release=PUBLICAR."
          }
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw "El canal estable requiere una versión MAJOR.MINOR.PATCH."
          }
          foreach ($required in @(
            "WINDOWS_CERTIFICATE",
            "WINDOWS_CERTIFICATE_PASSWORD",
            "WINDOWS_TIMESTAMP_URL"
          )) {
            $value = [Environment]::GetEnvironmentVariable($required)
            if ([string]::IsNullOrWhiteSpace($value)) {
              throw "Falta el requisito obligatorio $required para una release firmada."
            }
          }

      - name: Importar certificado Windows temporal
        if: ${{ inputs.publish_release == true }}
        id: windows_certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "emovest-release.pfx"
          [IO.File]::WriteAllBytes(
            $pfxPath,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          )
          $securePassword = ConvertTo-SecureString `
            $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate `
            -FilePath $pfxPath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $securePassword
          "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT

      - name: Configurar release firmada
        if: ${{ inputs.publish_release == true }}
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          CERTIFICATE_THUMBPRINT: ${{ steps.windows_certificate.outputs.thumbprint }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          $releaseConfig = @{
            version = $env:VERSION
            bundle = @{
              windows = @{
                certificateThumbprint = $env:CERTIFICATE_THUMBPRINT
                digestAlgorithm = "sha256"
                timestampUrl = $env:WINDOWS_TIMESTAMP_URL
              }
            }
          }
          $releaseConfig |
            ConvertTo-Json -Depth 8 |
            Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP "tauri-release.json")

      - name: Construir instalador de desarrollo
        if: ${{ inputs.publish_release != true }}
        working-directory: frontend
        run: pnpm desktop:build

      - name: Construir instalador firmado con Authenticode
        if: ${{ inputs.publish_release == true }}
        working-directory: frontend
        shell: pwsh
        run: |
          pnpm desktop:prepare-sidecar
          pnpm tauri build --bundles nsis --config $env:RUNNER_TEMP\tauri-release.json

      - name: Validar aplicación instalada y ciclo de vida del sidecar
        shell: pwsh
        run: .\scripts\test-windows-desktop.ps1

      - name: Preparar artefactos
        id: artifacts
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "emovest-artifacts"
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          $installer = Get-ChildItem `
            "frontend\src-tauri\target\release\bundle\nsis\*-setup.exe" |
            Select-Object -First 1
          if (-not $installer) {
            throw "Tauri no generó un instalador NSIS."
          }
          $installerTarget = Join-Path $output "EmoVest-Setup.exe"
          Copy-Item $installer.FullName $installerTarget
          "path=$output" >> $env:GITHUB_OUTPUT

      - name: Subir instalador como artefacto de CI
        uses: actions/upload-artifact@v6
        with:
          name: EmoVest-Windows-${{ inputs.version || github.sha }}
          path: ${{ steps.artifacts.outputs.path }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publicar release firmada
    if: ${{ inputs.publish_release == true }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar artefactos firmados
        uses: actions/download-artifact@v7
        with:
          name: EmoVest-Windows-${{ inputs.version }}
          path: artifacts

      - name: Publicar release explícita
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ inputs.version }}
          name: EmoVest ${{ inputs.version }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            artifacts/EmoVest-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
