services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-emovest}
      MYSQL_USER: ${MYSQL_USER:-emovest}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-emovest_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: sh -c "python create_tables.py && uvicorn app:app --host 0.0.0.0 --port 8000"
    env_file:
      - .env.local-server
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - backend-images:/app/images
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python worker.py
    env_file:
      - .env.local-server
    volumes:
      - backend-images:/app/images
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: .
      dockerfile: docker/local-server/web.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "${WEB_PORT:-5173}:4173"
    depends_on:
      api:
        condition: service_started

volumes:
  mysql-data:
  backend-images:
